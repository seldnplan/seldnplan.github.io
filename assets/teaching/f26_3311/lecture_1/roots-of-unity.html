* {

html &gt; body {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

  background: transparent !important;

  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);

  text-decoration: none;
  text-underline-offset: 2px;

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;

h1,
h2,
h3,
h4,
h5,
h6,

  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

}

code:not(pre code) {

}

  overflow-x: auto;

  color: var(--foreground);

}

.table :is(th, td) {

}

.table-responsive &gt; .table :is(th, td) {

}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

}

.table .text-nowrap {

  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;

.card {

  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),

  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;

}

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;

.viz-controls {

  flex-wrap: wrap;
  align-items: center;

      &lt;title id=&quot;rou-svg-title&quot;&gt;Roots of unity on the complex plane&lt;/title&gt;

  &lt;div class=&quot;rou-detail&quot; aria-live=&quot;polite&quot;&gt;
    &lt;p&gt;&lt;output id=&quot;rou-exact&quot;&gt;ζ₀ = exp(i · 0)&lt;/output&gt;&lt;/p&gt;
    &lt;p class=&quot;text-muted&quot;&gt;&lt;output id=&quot;rou-value&quot;&gt;θ = 0° · 1.000 + 0.000i&lt;/output&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;roots-unity-applet&#x27;);
      const degreeInput = root.querySelector(&#x27;#rou-degree&#x27;);
      const degreeValue = root.querySelector(&#x27;#rou-degree-value&#x27;);
      const rootSelect = root.querySelector(&#x27;#rou-root-select&#x27;);
      const equation = root.querySelector(&#x27;#rou-equation&#x27;);
      const exactOutput = root.querySelector(&#x27;#rou-exact&#x27;);
      const valueOutput = root.querySelector(&#x27;#rou-value&#x27;);
      const plotWrap = root.querySelector(&#x27;#rou-plot-wrap&#x27;);
      const svg = root.querySelector(&#x27;#rou-plot&#x27;);
      const svgDesc = root.querySelector(&#x27;#rou-svg-desc&#x27;);
      const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
      const svgNS = &#x27;http://www.w3.org/2000/svg&#x27;;
      const superscriptMap = {
        &#x27;-&#x27;: &#x27;⁻&#x27;, &#x27;0&#x27;: &#x27;⁰&#x27;, &#x27;1&#x27;: &#x27;¹&#x27;, &#x27;2&#x27;: &#x27;²&#x27;, &#x27;3&#x27;: &#x27;³&#x27;, &#x27;4&#x27;: &#x27;⁴&#x27;,
        &#x27;5&#x27;: &#x27;⁵&#x27;, &#x27;6&#x27;: &#x27;⁶&#x27;, &#x27;7&#x27;: &#x27;⁷&#x27;, &#x27;8&#x27;: &#x27;⁸&#x27;, &#x27;9&#x27;: &#x27;⁹&#x27;
      };
      const subscriptMap = {
        &#x27;0&#x27;: &#x27;₀&#x27;, &#x27;1&#x27;: &#x27;₁&#x27;, &#x27;2&#x27;: &#x27;₂&#x27;, &#x27;3&#x27;: &#x27;₃&#x27;, &#x27;4&#x27;: &#x27;₄&#x27;,
        &#x27;5&#x27;: &#x27;₅&#x27;, &#x27;6&#x27;: &#x27;₆&#x27;, &#x27;7&#x27;: &#x27;₇&#x27;, &#x27;8&#x27;: &#x27;₈&#x27;, &#x27;9&#x27;: &#x27;₉&#x27;
      };
      let degree = Number(degreeInput.value);
      let selected = 0;
      let lastDegree = degree;
      let animationFrame = null;

      const toSuper = value =&gt; String(value).split(&#x27;&#x27;).map(char =&gt; superscriptMap[char] || char).join(&#x27;&#x27;);
      const toSub = value =&gt; String(value).split(&#x27;&#x27;).map(char =&gt; subscriptMap[char] || char).join(&#x27;&#x27;);
      const makeSvg = name =&gt; document.createElementNS(svgNS, name);
      const setAttrs = (node, attrs) =&gt; Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, value));
      const gcd = (a, b) =&gt; b === 0 ? a : gcd(b, a % b);

      function rootPoint(k, n, cx, cy, radius) {
        const angle = (2 * Math.PI * k) / n;
        return {
          x: cx + radius * Math.cos(angle),
          y: cy - radius * Math.sin(angle),
          angle
        };
      }

      function angleText(k, n) {
        if (k === 0) return &#x27;0&#x27;;
        const common = gcd(2 * k, n);
        const numerator = (2 * k) / common;
        const denominator = n / common;
        const top = numerator === 1 ? &#x27;π&#x27; : `${numerator}π`;
        return denominator === 1 ? top : `${top}/${denominator}`;
      }

      function updateSelector() {
        rootSelect.replaceChildren();
        for (let k = 0; k &lt; degree; k += 1) {
          const option = document.createElement(&#x27;option&#x27;);
          option.value = String(k);
          option.textContent = `ζ${toSub(k)}  (k = ${k})`;
          rootSelect.appendChild(option);
        }
        selected = Math.min(selected, degree - 1);
        rootSelect.value = String(selected);
      }

      function updateText() {
        const theta = (2 * Math.PI * selected) / degree;
        const real = Math.abs(Math.cos(theta)) &lt; 0.0005 ? 0 : Math.cos(theta);
        const imaginary = Math.abs(Math.sin(theta)) &lt; 0.0005 ? 0 : Math.sin(theta);
        const sign = imaginary &lt; 0 ? &#x27;−&#x27; : &#x27;+&#x27;;
        equation.textContent = `z${toSuper(degree)} = 1`;
        degreeValue.value = String(degree);
        exactOutput.value = `ζ${toSub(selected)} = exp(i · ${angleText(selected, degree)})`;
        valueOutput.value = `θ = ${(360 * selected / degree).toFixed(degree &gt; 20 ? 1 : 0)}° · ${real.toFixed(3)} ${sign} ${Math.abs(imaginary).toFixed(3)}i`;
        svgDesc.textContent = `${degree} equally spaced ${degree === 1 ? &#x27;point&#x27; : &#x27;points&#x27;} on the unit circle. Root ${selected} is highlighted.`;
      }

      function draw(progress = 1) {
        const width = Math.max(320, Math.round(plotWrap.getBoundingClientRect().width));
        const height = Math.max(280, Math.min(560, Math.round(width * 0.72)));
        const margin = width &lt; 440 ? 42 : 52;
        const cx = width / 2;
        const cy = height / 2;
        const radius = Math.max(78, Math.min((width - 2 * margin) / 2, (height - 2 * margin) / 2));

        svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
        svg.setAttribute(&#x27;width&#x27;, String(width));
        svg.setAttribute(&#x27;height&#x27;, String(height));
        svg.replaceChildren();

        const title = makeSvg(&#x27;title&#x27;);
        title.id = &#x27;rou-svg-title&#x27;;
        title.textContent = &#x27;Roots of unity on the complex plane&#x27;;
        const desc = makeSvg(&#x27;desc&#x27;);
        desc.id = &#x27;rou-svg-desc&#x27;;
        desc.textContent = `${degree} equally spaced ${degree === 1 ? &#x27;point&#x27; : &#x27;points&#x27;} on the unit circle. Root ${selected} is highlighted.`;
        svg.append(title, desc);

        const frame = makeSvg(&#x27;rect&#x27;);
        setAttrs(frame, { x: 0.5, y: 0.5, width: width - 1, height: height - 1, class: &#x27;rou-frame&#x27;, &#x27;data-chart-frame&#x27;: &#x27;&#x27; });
        svg.appendChild(frame);

        const horizontalAxis = makeSvg(&#x27;line&#x27;);
        setAttrs(horizontalAxis, { x1: margin / 2, y1: cy, x2: width - margin / 2, y2: cy, class: &#x27;rou-axis&#x27; });
        const verticalAxis = makeSvg(&#x27;line&#x27;);
        setAttrs(verticalAxis, { x1: cx, y1: margin / 2, x2: cx, y2: height - margin / 2, class: &#x27;rou-axis&#x27; });
        svg.append(horizontalAxis, verticalAxis);

        [-1, 1].forEach(value =&gt; {
          const x = cx + value * radius;
          const y = cy - value * radius;
          const xTick = makeSvg(&#x27;line&#x27;);
          setAttrs(xTick, { x1: x, y1: cy - 4, x2: x, y2: cy + 4, class: &#x27;rou-tick&#x27; });
          const yTick = makeSvg(&#x27;line&#x27;);
          setAttrs(yTick, { x1: cx - 4, y1: y, x2: cx + 4, y2: y, class: &#x27;rou-tick&#x27; });
          const xLabel = makeSvg(&#x27;text&#x27;);
          setAttrs(xLabel, { x, y: cy + 18, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;rou-tick-label&#x27; });
          xLabel.textContent = String(value).replace(&#x27;-&#x27;, &#x27;−&#x27;);
          const yLabel = makeSvg(&#x27;text&#x27;);
          setAttrs(yLabel, { x: cx - 9, y: y + 4, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;rou-tick-label&#x27; });
          yLabel.textContent = String(value).replace(&#x27;-&#x27;, &#x27;−&#x27;);
          svg.append(xTick, yTick, xLabel, yLabel);
        });

        const xAxisLabel = makeSvg(&#x27;text&#x27;);
        setAttrs(xAxisLabel, { x: width - margin / 2, y: cy - 9, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;rou-axis-label axis-title&#x27;, &#x27;data-axis&#x27;: &#x27;x&#x27; });
        xAxisLabel.textContent = &#x27;Real&#x27;;
        const yAxisLabel = makeSvg(&#x27;text&#x27;);
        setAttrs(yAxisLabel, { x: cx + 9, y: margin / 2 + 12, class: &#x27;rou-axis-label axis-title&#x27;, &#x27;data-axis&#x27;: &#x27;y&#x27; });
        yAxisLabel.textContent = &#x27;Imaginary&#x27;;
        svg.append(xAxisLabel, yAxisLabel);

        const unitCircle = makeSvg(&#x27;circle&#x27;);
        setAttrs(unitCircle, { cx, cy, r: radius, class: &#x27;rou-circle&#x27; });
        svg.appendChild(unitCircle);

        const points = [];
        for (let k = 0; k &lt; degree; k += 1) {
          const oldPoint = rootPoint(k, lastDegree, cx, cy, radius);
          const newPoint = rootPoint(k, degree, cx, cy, radius);
          const startPoint = k &lt; lastDegree ? oldPoint : { x: cx, y: cy, angle: 0 };
          points.push({
            k,
            x: startPoint.x + (newPoint.x - startPoint.x) * progress,
            y: startPoint.y + (newPoint.y - startPoint.y) * progress,
            angle: newPoint.angle
          });
        }

        points.forEach(point =&gt; {
          const spoke = makeSvg(&#x27;line&#x27;);
          setAttrs(spoke, { x1: cx, y1: cy, x2: point.x, y2: point.y, class: &#x27;rou-spoke&#x27; });
          svg.appendChild(spoke);
        });

        points.forEach(point =&gt; {
          const marker = makeSvg(&#x27;circle&#x27;);
          const markerRadius = point.k === selected ? 8 : 6;
          setAttrs(marker, {
            cx: point.x,
            cy: point.y,
            r: markerRadius,
            class: `rou-root${point.k === selected ? &#x27; is-selected&#x27; : &#x27;&#x27;}`,
            &#x27;data-tooltip&#x27;: `ζ${toSub(point.k)}: angle ${angleText(point.k, degree)} radians`
          });
          marker.addEventListener(&#x27;click&#x27;, () =&gt; {
            selected = point.k;
            rootSelect.value = String(selected);
            updateText();
            draw(1);
          });
          svg.appendChild(marker);

          if (degree &lt;= 12) {
            const label = makeSvg(&#x27;text&#x27;);
            const dx = Math.cos(point.angle) * 17;
            const dy = -Math.sin(point.angle) * 17 + 4;
            setAttrs(label, {
              x: point.x + dx,
              y: point.y + dy,
              &#x27;text-anchor&#x27;: Math.cos(point.angle) &gt; 0.2 ? &#x27;start&#x27; : Math.cos(point.angle) &lt; -0.2 ? &#x27;end&#x27; : &#x27;middle&#x27;,
              class: &#x27;rou-label&#x27;
            });
            label.textContent = `ζ${toSub(point.k)}`;
            svg.appendChild(label);
          }
        });
      }

      function animateDegreeChange(previousDegree) {
        lastDegree = previousDegree;
        if (animationFrame) cancelAnimationFrame(animationFrame);
        if (reducedMotion.matches) {
          draw(1);
          lastDegree = degree;
          return;
        }
        const start = performance.now();
        const duration = 360;
        const tick = now =&gt; {
          const elapsed = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - elapsed, 3);
          draw(eased);
          if (elapsed &lt; 1) {
            animationFrame = requestAnimationFrame(tick);
          } else {
            lastDegree = degree;
            animationFrame = null;
          }
        };
        animationFrame = requestAnimationFrame(tick);
      }

      degreeInput.addEventListener(&#x27;input&#x27;, () =&gt; {
        const previousDegree = degree;
        degree = Number(degreeInput.value);
        selected = Math.min(selected, degree - 1);
        updateSelector();
        updateText();
        animateDegreeChange(previousDegree);
      });

      rootSelect.addEventListener(&#x27;change&#x27;, () =&gt; {
        selected = Number(rootSelect.value);
        updateText();
        draw(1);
      });

      const resizeObserver = new ResizeObserver(() =&gt; draw(1));
      resizeObserver.observe(plotWrap);
      updateSelector();
      updateText();
      draw(1);
    })();
  &lt;/script&gt;

  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;

  let skipDelayUntil = 0;

      .then(({ x, y }) =&gt; {

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);

      return;
    }

    if (activeTrigger === trigger) {

    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
