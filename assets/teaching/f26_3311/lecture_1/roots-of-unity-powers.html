html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;

  &lt;div class=&quot;rup-heading&quot;&gt;
    &lt;h2 id=&quot;rup-title&quot;&gt;Powers of a root&lt;/h2&gt;
    &lt;p&gt;&lt;code id=&quot;rup-alpha-equation&quot;&gt;α = ζ₃ ∈ μ₈&lt;/code&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Root controls&quot;&gt;
    &lt;div class=&quot;rup-degree-control&quot;&gt;
      &lt;div class=&quot;rup-control-head&quot;&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;rup-degree&quot;&gt;Degree &lt;em&gt;n&lt;/em&gt;&lt;/label&gt;

      &lt;/div&gt;
      &lt;input class=&quot;form-range&quot; id=&quot;rup-degree&quot; type=&quot;range&quot; min=&quot;2&quot; max=&quot;24&quot; step=&quot;1&quot; value=&quot;8&quot;&gt;
    &lt;/div&gt;
    &lt;label class=&quot;form-label rup-alpha-control&quot; for=&quot;rup-alpha-select&quot;&gt;
      Distinguished root α
      &lt;select class=&quot;form-select&quot; id=&quot;rup-alpha-select&quot;&gt;&lt;/select&gt;
    &lt;/label&gt;
  &lt;/div&gt;

  &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Power control&quot;&gt;
    &lt;div class=&quot;rup-power-control&quot;&gt;
      &lt;div class=&quot;rup-control-head&quot;&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;rup-power&quot;&gt;Power &lt;em&gt;m&lt;/em&gt;&lt;/label&gt;
        &lt;output id=&quot;rup-power-value&quot; for=&quot;rup-power&quot;&gt;m = 4&lt;/output&gt;
      &lt;/div&gt;
      &lt;input class=&quot;form-range&quot; id=&quot;rup-power&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;1&quot; value=&quot;4&quot;&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;rup-plot-wrap&quot; id=&quot;rup-plot-wrap&quot;&gt;
    &lt;svg class=&quot;rup-plot&quot; id=&quot;rup-plot&quot; role=&quot;img&quot; aria-labelledby=&quot;rup-svg-title rup-svg-desc&quot;&gt;
      &lt;title id=&quot;rup-svg-title&quot;&gt;Powers of a selected root on the complex plane&lt;/title&gt;
      &lt;desc id=&quot;rup-svg-desc&quot;&gt;The powers of zeta three trace an eight-step cycle through all eighth roots of unity.&lt;/desc&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;div class=&quot;rup-detail&quot; aria-live=&quot;polite&quot;&gt;
    &lt;p&gt;&lt;output id=&quot;rup-current-value&quot;&gt;α⁴ = ζ₄ = −1.000 + 0.000i&lt;/output&gt;&lt;/p&gt;
    &lt;p class=&quot;text-muted&quot;&gt;&lt;output id=&quot;rup-order-value&quot;&gt;order(α) = 8 · α⁸ = 1&lt;/output&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;roots-unity-powers&#x27;);
      const degreeInput = root.querySelector(&#x27;#rup-degree&#x27;);
      const degreeValue = root.querySelector(&#x27;#rup-degree-value&#x27;);
      const alphaSelect = root.querySelector(&#x27;#rup-alpha-select&#x27;);
      const alphaEquation = root.querySelector(&#x27;#rup-alpha-equation&#x27;);
      const powerInput = root.querySelector(&#x27;#rup-power&#x27;);
      const powerValue = root.querySelector(&#x27;#rup-power-value&#x27;);
      const currentValue = root.querySelector(&#x27;#rup-current-value&#x27;);
      const orderValue = root.querySelector(&#x27;#rup-order-value&#x27;);
      const plotWrap = root.querySelector(&#x27;#rup-plot-wrap&#x27;);
      const svg = root.querySelector(&#x27;#rup-plot&#x27;);
      const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
      const svgNS = &#x27;http://www.w3.org/2000/svg&#x27;;
      const superscriptMap = {
        &#x27;-&#x27;: &#x27;⁻&#x27;, &#x27;0&#x27;: &#x27;⁰&#x27;, &#x27;1&#x27;: &#x27;¹&#x27;, &#x27;2&#x27;: &#x27;²&#x27;, &#x27;3&#x27;: &#x27;³&#x27;, &#x27;4&#x27;: &#x27;⁴&#x27;,
        &#x27;5&#x27;: &#x27;⁵&#x27;, &#x27;6&#x27;: &#x27;⁶&#x27;, &#x27;7&#x27;: &#x27;⁷&#x27;, &#x27;8&#x27;: &#x27;⁸&#x27;, &#x27;9&#x27;: &#x27;⁹&#x27;
      };
      const subscriptMap = {
        &#x27;0&#x27;: &#x27;₀&#x27;, &#x27;1&#x27;: &#x27;₁&#x27;, &#x27;2&#x27;: &#x27;₂&#x27;, &#x27;3&#x27;: &#x27;₃&#x27;, &#x27;4&#x27;: &#x27;₄&#x27;,
        &#x27;5&#x27;: &#x27;₅&#x27;, &#x27;6&#x27;: &#x27;₆&#x27;, &#x27;7&#x27;: &#x27;₇&#x27;, &#x27;8&#x27;: &#x27;₈&#x27;, &#x27;9&#x27;: &#x27;₉&#x27;
      };
      let degree = Number(degreeInput.value);
      let alphaIndex = 3;
      let power = Number(powerInput.value);
      let previousPower = power;
      let markerProgress = 1;
      let animationFrame = null;

      const toSuper = value =&gt; String(value).split(&#x27;&#x27;).map(char =&gt; superscriptMap[char] || char).join(&#x27;&#x27;);
      const toSub = value =&gt; String(value).split(&#x27;&#x27;).map(char =&gt; subscriptMap[char] || char).join(&#x27;&#x27;);
      const makeSvg = name =&gt; document.createElementNS(svgNS, name);
      const setAttrs = (node, attrs) =&gt; Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, value));
      const gcd = (a, b) =&gt; b === 0 ? a : gcd(b, a % b);
      const alphaOrder = () =&gt; degree / gcd(degree, alphaIndex);
      const rootIndexAtPower = exponent =&gt; (alphaIndex * exponent) % degree;

      function rootPoint(index, cx, cy, radius) {
        const angle = (2 * Math.PI * index) / degree;
        return {
          x: cx + radius * Math.cos(angle),
          y: cy - radius * Math.sin(angle),
          angle
        };
      }

      function pathFrom(points, close = false) {
        if (!points.length) return &#x27;&#x27;;
        const parts = [`M ${points[0].x} ${points[0].y}`];
        for (let i = 1; i &lt; points.length; i += 1) {
          parts.push(`L ${points[i].x} ${points[i].y}`);
        }
        if (close &amp;&amp; points.length &gt; 1) parts.push(&#x27;Z&#x27;);
        return parts.join(&#x27; &#x27;);
      }

      function formatComponent(value) {
        const clean = Math.abs(value) &lt; 0.0005 ? 0 : value;
        return clean.toFixed(3).replace(&#x27;-&#x27;, &#x27;−&#x27;);
      }

      function updateAlphaSelector() {
        alphaSelect.replaceChildren();
        for (let k = 0; k &lt; degree; k += 1) {
          const option = document.createElement(&#x27;option&#x27;);
          option.value = String(k);
          option.textContent = `ζ${toSub(k)}  (k = ${k})`;
          alphaSelect.appendChild(option);
        }
        alphaIndex = Math.min(alphaIndex, degree - 1);
        alphaSelect.value = String(alphaIndex);
      }

      function updateStateText() {
        const order = alphaOrder();
        power = Math.min(power, order);
        powerInput.max = String(order);
        powerInput.value = String(power);
        const currentIndex = rootIndexAtPower(power);
        const theta = (2 * Math.PI * currentIndex) / degree;
        const real = Math.cos(theta);
        const imaginary = Math.sin(theta);
        const sign = imaginary &lt; -0.0005 ? &#x27;−&#x27; : &#x27;+&#x27;;

        degreeValue.value = String(degree);
        powerValue.value = `m = ${power} of ${order}`;
        alphaEquation.textContent = `α = ζ${toSub(alphaIndex)} ∈ μ${toSub(degree)}`;
        currentValue.value = `α${toSuper(power)} = ζ${toSub(currentIndex)} = ${formatComponent(real)} ${sign} ${formatComponent(Math.abs(imaginary))}i`;
        orderValue.value = `order(α) = ${order} · α${toSuper(order)} = 1`;
      }

      function draw() {
        const width = Math.max(320, Math.round(plotWrap.getBoundingClientRect().width));
        const height = Math.max(280, Math.min(550, Math.round(width * 0.72)));
        const margin = width &lt; 440 ? 44 : 54;
        const cx = width / 2;
        const cy = height / 2;
        const radius = Math.max(78, Math.min((width - 2 * margin) / 2, (height - 2 * margin) / 2));
        const order = alphaOrder();
        const orbitIndices = Array.from({ length: order }, (_, exponent) =&gt; rootIndexAtPower(exponent));
        const subgroup = new Set(orbitIndices);
        const orbitPoints = orbitIndices.map(index =&gt; rootPoint(index, cx, cy, radius));
        const trailPoints = Array.from({ length: power + 1 }, (_, exponent) =&gt; rootPoint(rootIndexAtPower(exponent), cx, cy, radius));
        const oldPoint = rootPoint(rootIndexAtPower(previousPower), cx, cy, radius);
        const newPoint = rootPoint(rootIndexAtPower(power), cx, cy, radius);
        const currentPoint = {
          x: oldPoint.x + (newPoint.x - oldPoint.x) * markerProgress,
          y: oldPoint.y + (newPoint.y - oldPoint.y) * markerProgress,
          angle: newPoint.angle
        };
        const alphaPoint = rootPoint(alphaIndex, cx, cy, radius);

        svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
        svg.setAttribute(&#x27;width&#x27;, String(width));
        svg.setAttribute(&#x27;height&#x27;, String(height));
        svg.replaceChildren();

        const title = makeSvg(&#x27;title&#x27;);
        title.id = &#x27;rup-svg-title&#x27;;
        title.textContent = &#x27;Powers of a selected root on the complex plane&#x27;;
        const desc = makeSvg(&#x27;desc&#x27;);
        desc.id = &#x27;rup-svg-desc&#x27;;
        desc.textContent = `The powers of zeta ${alphaIndex} trace a cycle of length ${order} among the ${degree}th roots of unity. Power ${power} is highlighted.`;
        svg.append(title, desc);

        const frame = makeSvg(&#x27;rect&#x27;);
        setAttrs(frame, { x: 0.5, y: 0.5, width: width - 1, height: height - 1, class: &#x27;rup-frame&#x27;, &#x27;data-chart-frame&#x27;: &#x27;&#x27; });
        svg.appendChild(frame);

        const horizontalAxis = makeSvg(&#x27;line&#x27;);
        setAttrs(horizontalAxis, { x1: margin / 2, y1: cy, x2: width - margin / 2, y2: cy, class: &#x27;rup-axis&#x27; });
        const verticalAxis = makeSvg(&#x27;line&#x27;);
        setAttrs(verticalAxis, { x1: cx, y1: margin / 2, x2: cx, y2: height - margin / 2, class: &#x27;rup-axis&#x27; });
        svg.append(horizontalAxis, verticalAxis);

        [-1, 1].forEach(value =&gt; {
          const x = cx + value * radius;
          const y = cy - value * radius;
          const xTick = makeSvg(&#x27;line&#x27;);
          setAttrs(xTick, { x1: x, y1: cy - 4, x2: x, y2: cy + 4, class: &#x27;rup-tick&#x27; });
          const yTick = makeSvg(&#x27;line&#x27;);
          setAttrs(yTick, { x1: cx - 4, y1: y, x2: cx + 4, y2: y, class: &#x27;rup-tick&#x27; });
          const xLabel = makeSvg(&#x27;text&#x27;);
          setAttrs(xLabel, { x, y: cy + 18, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;rup-tick-label&#x27; });
          xLabel.textContent = String(value).replace(&#x27;-&#x27;, &#x27;−&#x27;);
          const yLabel = makeSvg(&#x27;text&#x27;);
          setAttrs(yLabel, { x: cx - 9, y: y + 4, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;rup-tick-label&#x27; });
          yLabel.textContent = String(value).replace(&#x27;-&#x27;, &#x27;−&#x27;);
          svg.append(xTick, yTick, xLabel, yLabel);
        });

        const xAxisLabel = makeSvg(&#x27;text&#x27;);
        setAttrs(xAxisLabel, { x: width - margin / 2, y: cy - 9, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;rup-axis-label axis-title&#x27;, &#x27;data-axis&#x27;: &#x27;x&#x27; });
        xAxisLabel.textContent = &#x27;Real&#x27;;
        const yAxisLabel = makeSvg(&#x27;text&#x27;);
        setAttrs(yAxisLabel, { x: cx + 9, y: margin / 2 + 12, class: &#x27;rup-axis-label axis-title&#x27;, &#x27;data-axis&#x27;: &#x27;y&#x27; });
        yAxisLabel.textContent = &#x27;Imaginary&#x27;;
        svg.append(xAxisLabel, yAxisLabel);

        const unitCircle = makeSvg(&#x27;circle&#x27;);
        setAttrs(unitCircle, { cx, cy, r: radius, class: &#x27;rup-circle&#x27; });
        svg.appendChild(unitCircle);

        if (orbitPoints.length &gt; 1) {
          const cycle = makeSvg(&#x27;path&#x27;);
          setAttrs(cycle, { d: pathFrom(orbitPoints, true), class: &#x27;rup-cycle&#x27; });
          svg.appendChild(cycle);
        }

        if (trailPoints.length &gt; 1) {
          const trail = makeSvg(&#x27;path&#x27;);
          setAttrs(trail, { d: pathFrom(trailPoints), class: &#x27;rup-trail&#x27; });
          svg.appendChild(trail);
        }

        for (let index = 0; index &lt; degree; index += 1) {
          const point = rootPoint(index, cx, cy, radius);
          const marker = makeSvg(&#x27;circle&#x27;);
          setAttrs(marker, {
            cx: point.x,
            cy: point.y,
            r: subgroup.has(index) ? 6 : 4,
            class: `rup-root${subgroup.has(index) ? &#x27; is-subgroup&#x27; : &#x27;&#x27;}`
          });
          svg.appendChild(marker);

          const hit = makeSvg(&#x27;circle&#x27;);
          setAttrs(hit, {
            cx: point.x,
            cy: point.y,
            r: 16,
            class: &#x27;rup-hit&#x27;,
            &#x27;data-chart-hit&#x27;: &#x27;&#x27;,
            &#x27;data-tooltip&#x27;: `Choose ζ${toSub(index)} as α`
          });
          hit.addEventListener(&#x27;click&#x27;, () =&gt; {
            alphaIndex = index;
            alphaSelect.value = String(alphaIndex);
            power = Math.min(power, alphaOrder());
            previousPower = power;
            markerProgress = 1;
            updateStateText();
            draw();
          });
          svg.appendChild(hit);
        }

        const alphaMarker = makeSvg(&#x27;rect&#x27;);
        setAttrs(alphaMarker, {
          x: alphaPoint.x - 6,
          y: alphaPoint.y - 6,
          width: 12,
          height: 12,
          class: &#x27;rup-alpha&#x27;,
          transform: `rotate(45 ${alphaPoint.x} ${alphaPoint.y})`
        });
        svg.appendChild(alphaMarker);

        const currentMarker = makeSvg(&#x27;circle&#x27;);
        setAttrs(currentMarker, { cx: currentPoint.x, cy: currentPoint.y, r: 8, class: &#x27;rup-current&#x27; });
        svg.appendChild(currentMarker);

        function addLabel(point, text, extraOffset = 0) {
          const label = makeSvg(&#x27;text&#x27;);
          const offset = 18 + extraOffset;
          const cosine = Math.cos(point.angle);
          const sine = Math.sin(point.angle);
          setAttrs(label, {
            x: point.x + cosine * offset,
            y: point.y - sine * offset + 4,
            &#x27;text-anchor&#x27;: cosine &gt; 0.2 ? &#x27;start&#x27; : cosine &lt; -0.2 ? &#x27;end&#x27; : &#x27;middle&#x27;,
            class: &#x27;rup-label&#x27;
          });
          label.textContent = text;
          svg.appendChild(label);
        }

        const samePoint = rootIndexAtPower(power) === alphaIndex;
        if (samePoint) {
          addLabel(alphaPoint, `α = α${toSuper(power)}`);
        } else {
          addLabel(alphaPoint, &#x27;α&#x27;);
          addLabel(newPoint, `α${toSuper(power)}`);
        }
      }

      function animatePowerChange(oldPower) {
        previousPower = oldPower;
        if (animationFrame) cancelAnimationFrame(animationFrame);
        if (reducedMotion.matches) {
          markerProgress = 1;
          draw();
          previousPower = power;
          return;
        }
        const start = performance.now();
        const duration = 320;
        const tick = now =&gt; {
          const elapsed = Math.min(1, (now - start) / duration);
          markerProgress = 1 - Math.pow(1 - elapsed, 3);
          draw();
          if (elapsed &lt; 1) {
            animationFrame = requestAnimationFrame(tick);
          } else {
            previousPower = power;
            markerProgress = 1;
            animationFrame = null;
          }
        };
        markerProgress = 0;
        animationFrame = requestAnimationFrame(tick);
      }

      degreeInput.addEventListener(&#x27;input&#x27;, () =&gt; {
        degree = Number(degreeInput.value);
        alphaIndex = Math.min(alphaIndex, degree - 1);
        updateAlphaSelector();
        power = Math.min(power, alphaOrder());
        previousPower = power;
        markerProgress = 1;
        updateStateText();
        draw();
      });

      alphaSelect.addEventListener(&#x27;change&#x27;, () =&gt; {
        alphaIndex = Number(alphaSelect.value);
        power = Math.min(power, alphaOrder());
        previousPower = power;
        markerProgress = 1;
        updateStateText();
        draw();
      });

      powerInput.addEventListener(&#x27;input&#x27;, () =&gt; {
        const oldPower = power;
        power = Number(powerInput.value);
        updateStateText();
        animatePowerChange(oldPower);
      });

      const resizeObserver = new ResizeObserver(() =&gt; draw());
      resizeObserver.observe(plotWrap);
      updateAlphaSelector();
      updateStateText();
      draw();
    })();
  &lt;/script&gt;
&lt;/section&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
